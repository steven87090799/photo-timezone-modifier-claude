name: Materialize reviewed repair branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/metadata-only-three-offsets-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply verified source transfer
        run: |
          test -f .repair-transfer/apply.py
          python3 .repair-transfer/apply.py
          git config user.name 'PhotoTimezone repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Fix three-offset metadata-only transactions, worker lifecycle, UI costs and packaging'
          git push origin HEAD:fix/metadata-only-three-offsets-20261001
