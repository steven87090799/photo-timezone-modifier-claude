name: macOS native app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Run the 1000-photo write and backup integrity test
        type: boolean
        default: false

permissions:
  contents: read

# Cancel stale PR runs; each main push keeps its own build and release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test-and-build-macos:
    # Shipping/test baseline is Apple Silicon running macOS 27+.
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch pinned real Sony A7 IV ARW fixture
        shell: bash
        run: |
          fixture="$(bash ./scripts/fetch-real-arw-fixture.sh)"
          echo "PHOTO_TIMEZONE_REAL_ARW_FIXTURE=$fixture" >> "$GITHUB_ENV"

      - name: Full native regression suite
        timeout-minutes: 15
        env:
          PHOTO_TIMEZONE_STRESS: '0'
        run: ./scripts/test.sh

      - name: Optional thousand-photo stability test
        if: github.event_name == 'workflow_dispatch' && inputs.stress
        timeout-minutes: 15
        env:
          PHOTO_TIMEZONE_STRESS: '1'
        run: ./scripts/test.sh --filter testThousand

      - name: Identify automatic build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" app/Info.plist

      - name: Build Apple Silicon app
        timeout-minutes: 8
        run: ./build.sh

      - name: Check verified build archive
        run: unzip -tq dist/PhotoTimezone-macOS.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhotoTimezone-macOS
          path: dist/PhotoTimezone-macOS.zip
          if-no-files-found: error

  publish-app:
    # PRs get downloadable Actions artifacts; only main can publish Releases.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-and-build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PhotoTimezone-macOS
          path: dist
      - name: Publish downloadable main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-$GITHUB_SHA"
          notes="$RUNNER_TEMP/app-release-notes.md"
          cat > "$notes" <<EOF
          自動建置的 macOS 27+ Apple Silicon App，適用 M 系列晶片。
          下載 PhotoTimezone-macOS.zip，解壓縮後將 App 放到「應用程式」。

          提交：$GITHUB_SHA
          建置編號：$GITHUB_RUN_NUMBER
          測試與建置：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          此版本使用 ad-hoc 簽章，尚未取得 Apple Developer ID 簽章／公證。
          EOF
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "macOS App · build $GITHUB_RUN_NUMBER" --notes-file "$notes"
          fi
          gh release upload "$tag" dist/PhotoTimezone-macOS.zip --clobber
          # A slower old build is archived without replacing the newest download.
          main_head="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          latest=false
          if [[ "$main_head" == "$GITHUB_SHA" ]]; then latest=true; fi
          gh release edit "$tag" --draft=false --latest="$latest" --notes-file "$notes"
