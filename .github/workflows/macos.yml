name: macOS native app

on:
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Run the 1000-photo write and backup integrity test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test generated JPEG and TIFF fixtures
        run: ./scripts/test.sh
      - name: Optional thousand-photo stability test
        if: github.event_name == 'workflow_dispatch' && inputs.stress
        env:
          PHOTO_TIMEZONE_STRESS: '1'
        run: ./scripts/test.sh --filter testThousand
      - name: Build universal app
        run: ./build.sh --universal
      - name: Package app preserving executable modes
        run: ditto -c -k --sequesterRsrc --keepParent "dist/相片時區修改器.app" dist/PhotoTimezone-3.4.1-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhotoTimezone-macOS
          path: dist/PhotoTimezone-3.4.1-macOS.zip
          if-no-files-found: error
